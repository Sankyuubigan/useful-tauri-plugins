[workspace]
resolver = "2"
members = [
    "tauri-plugin-about-updates",
    "tauri-plugin-speech",
    "tauri-plugin-logs",
    "tauri-plugin-llama-engine",
    "tauri-plugin-cloud-routers",
    "tauri-plugin-cloud-routers/crates/core",
    "tauri-plugin-cloud-routers/crates/gateway",
    "tauri-plugin-downloader",
    "tauri-plugin-image-engine",
    "tauri-plugin-ytdlp",
    "tauri-plugin-system1",
    "ko-json-store",
    "agent-tools",
]

[workspace.dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# CLI-крейт agent-tools: парсер команд (без Tauri). derive нужен только ему.
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# agent-tools / codemap: парсеры кода на ЧИСТОМ Rust, без C-компилятора.
# Версии пиняются точно: oxc версионируется очень активно (0.154.0 на 15.10.26).
# Проверено рекурсивно по crates.io API: ни у одного из них нет build-dep на cc/cmake.
# Ветка tree-sitter отклонена (28 грамматик × cc), ast-grep-core отклонён (29 × cc),
# wasm-грамматики отклонены (emscripten side-модули, ни wasmi ни wasmtime не умеют dylink).
# Версия syn = "2" совпадает с уже присутствующим в lock king_orch — новых пакетов не добавляет.
syn = { version = "2", features = ["full", "visit", "extra-traits", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# TS/JS/TSX: парсер + семантический анализ (символьная таблица даёт defs И refs).
oxc_parser = "0.154.0"
oxc_semantic = "0.154.0"
oxc_allocator = "0.154.0"
oxc_ast = "0.154.0"
oxc_span = "0.154.0"

# Python: rustpython-parser (чистый Rust, в отличие от ruff_python_parser,
# который тянет stacker -> обязательный cc build-dep на Windows).
# Оговорка: последний релиз 06.08.2024, актуальность грамматики не проверена.
rustpython-parser = "0.4.0"
rustpython-ast = "0.4.0"

# Аудио (декод + шумоподавление + ресемплинг для голосов TTS)
symphonia = { version = "0.6", features = ["ogg", "vorbis", "wav", "pcm", "flac", "mp3"] }
hound = "3"
opus = "0.3"
ogg = "0.9"
nnnoiseless = "0.5"
rubato = "5"
audioadapter-buffers = "5"

# Скачивание движка CrispASR (prebuilt-процесс, HTTP)
futures = "0.3"
zip = "2"

# STT: WebSocket-клиент + инжекция текста (без нативного линкования CrispASR)
tungstenite = { version = "0.24", features = ["native-tls"] }
arboard = "3"
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }

# Единый кастомный log::Log логгер хоста (core rules §2.5)
log = "0.4"

# Движок llama.cpp (tauri-plugin-llama-engine): GPU-детект, VRAM, скачивание моделей.
# reqwest в плагине объявлен отдельно (default-features=false + rustls, как в хосте).
sysinfo = "0.30.0"
nvml-wrapper = "0.10.0"
sha2 = "0.10"
futures-util = "0.3"
minijinja = "1.0"

# Сохранение озвучки в MP3 (команда `tts_save_mp3` плагина tauri-plugin-speech).
# Pure Rust MP3-энкодер: ноль зависимостей, без build.rs, Apache-2.0, CI зелёный
# на windows-latest. Раньше здесь был `glint-audio` -> `glint-audio-sys`: 50
# вендоренных C++ файлов и непочиненный MSVC-баг (M_PI без _USE_MATH_DEFINES).
rusty_mp3 = "0.8"

# Атомарные записи JSON + блокировки (ko-json-store)
fs2 = "0.4"

# System-1 рантайм (tauri-plugin-system1): ONNX Runtime грузится динамически,
# поэтому статической линковки нет и CUDA/DirectML не тянутся в бинарь хоста.
# Версия DLL — ONNX Runtime >= 1.27 (ORT_API_VERSION у ort 2.0.0-rc.13 = 27).
ort = { version = "2.0.0-rc.9", features = ["load-dynamic", "ndarray"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.16"
