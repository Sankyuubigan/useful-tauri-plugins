[package]
name = "tauri-plugin-llama-engine"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-llama-engine"
description = "Reusable llama.cpp engine: install/update llama-server.exe variants, gguf catalog, model list mgmt, sampling params, vram notices (SSOT for King Orch and other hosts)"
license = "MIT"
readme = "docs/README.md"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
# Движок (внешний процесс) + каталог моделей. reqwest — как в хосте King Orch
# (default-features=false + rustls, чтобы не конфликтовать с native-tls воркспейса).
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots", "stream", "blocking"], default-features = false }
zip = { workspace = true }
sysinfo = "0.30.0"
nvml-wrapper = "0.10.0"
sha2 = "0.10"
futures-util = "0.3"
minijinja = { workspace = true }

# Опциональная связка с tauri-plugin-logs (единая телеметрия King Orch). Хост
# включает feature `host-logs`, если рядом стоит плагин логов.
tauri-plugin-logs = { path = "../tauri-plugin-logs", optional = true }
# Единый движок скачивания (SSOT): multi-chunk reqwest + curl + process-фоллбэки,
# stall/resume/прогресс `downloader:progress`. Заменяет старый download_fallback.
tauri-plugin-downloader = { path = "../tauri-plugin-downloader" }

[features]
default = []
host-logs = ["dep:tauri-plugin-logs"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lib]
name = "tauri_plugin_llama_engine"
path = "src/lib.rs"