"$schema" = "../gen/schemas/acl.json"

# ── Cloud Routers gateway ──

[[permission]]
identifier = "allow-get-status"
description = "Allow reading the cloud router gateway status (installed/running/version/port)."
commands.allow = ["get_status"]

[[permission]]
identifier = "allow-install-or-update"
description = "Allow installing/updating cloud routers (portable node.exe + npm bundle)."
commands.allow = ["install_or_update"]

[[permission]]
identifier = "allow-ensure-started"
description = "Allow lazily starting the cloud router server on demand."
commands.allow = ["ensure_started"]

[[permission]]
identifier = "allow-stop"
description = "Allow stopping the cloud router server."
commands.allow = ["stop"]

[[permission]]
identifier = "allow-set-router-dir"
description = "Allow overriding the cloud router install directory and re-checking whether the router is present there."
commands.allow = ["set_router_dir"]

[[permission]]
identifier = "allow-get-combos"
description = "Allow listing cloud router LLM combos for the chat model picker."
commands.allow = ["get_combos"]

[[permission]]
identifier = "allow-open-dashboard"
description = "Allow requesting the cloud router web dashboard (the host shows it as an in-app tab)."
commands.allow = ["open_dashboard"]

[[permission]]
identifier = "allow-chat-completion"
description = "Allow running an OpenAI-compatible chat completion through cloud routers."
commands.allow = ["chat_completion"]

[[permission]]
identifier = "allow-set-api-key"
description = "Allow setting the cloud router API key."
commands.allow = ["set_api_key"]

[[permission]]
identifier = "allow-check-router-update"
description = "Allow checking for cloud router updates from npm registry."
commands.allow = ["check_router_update"]

[default]
description = "Default permissions for the cloud-routers plugin."
permissions = [
  "allow-get-status",
  "allow-install-or-update",
  "allow-ensure-started",
  "allow-stop",
  "allow-set-router-dir",
  "allow-get-combos",
  "allow-set-api-key",
  "allow-open-dashboard",
  "allow-chat-completion",
  "allow-check-router-update",
]