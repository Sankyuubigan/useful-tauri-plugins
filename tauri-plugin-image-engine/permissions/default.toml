"$schema" = "../gen/schemas/acl.json"

# ── Движок sd.cpp ──

[[permission]]
identifier = "allow-get-image-engine-status"
description = "Allow reading the image engine status (installed variants, gpu)."
commands.allow = ["get_image_engine_status"]

[[permission]]
identifier = "allow-install-image-engine"
description = "Allow installing/downloading an sd.cpp backend variant."
commands.allow = ["install_image_engine"]

[[permission]]
identifier = "allow-set-image-engine-variant"
description = "Allow switching the image engine backend variant (cuda12/cpu/vulkan/rocm/auto)."
commands.allow = ["set_image_engine_variant"]

[[permission]]
identifier = "allow-check-image-engine-update"
description = "Allow checking for a newer sd.cpp engine release."
commands.allow = ["check_image_engine_update"]

[[permission]]
identifier = "allow-install-image-engine-update"
description = "Allow re-installing (updating) the sd.cpp engine."
commands.allow = ["install_image_engine_update"]

[[permission]]
identifier = "allow-remove-image-engine"
description = "Allow removing the sd.cpp engine backend."
commands.allow = ["remove_image_engine"]

[[permission]]
identifier = "allow-set-image-engine-dir"
description = "Allow overriding the image engine directory."
commands.allow = ["set_image_engine_dir"]

# ── Каталог бандлов ──

[[permission]]
identifier = "allow-get-image-models-catalog"
description = "Allow reading the embedded image model bundles catalog."
commands.allow = ["get_image_models_catalog"]

[[permission]]
identifier = "allow-get-image-bundle-info"
description = "Allow reading download proposal for the default image bundle."
commands.allow = ["get_image_bundle_info"]

[[permission]]
identifier = "allow-set-selected-image-bundle"
description = "Allow selecting the active image bundle (catalog entry)."
commands.allow = ["set_selected_image_bundle"]

[[permission]]
identifier = "allow-download-image-bundle"
description = "Allow downloading all files of the default image bundle."
commands.allow = ["download_image_bundle"]

[[permission]]
identifier = "allow-validate-image-bundle-dir"
description = "Allow validating an existing image bundle directory."
commands.allow = ["validate_image_bundle_dir"]

[[permission]]
identifier = "allow-set-image-bundle-dir"
description = "Allow pointing the image bundle to an existing valid directory."
commands.allow = ["set_image_bundle_dir"]

[[permission]]
identifier = "allow-remove-image-bundle-from-list"
description = "Allow resetting the image bundle directory to the storage default."
commands.allow = ["remove_image_bundle_from_list"]

[[permission]]
identifier = "allow-get-image-pool-orphans"
description = "Allow listing unused image pool files (orphans of removed catalog bundles)."
commands.allow = ["get_image_pool_orphans"]

[[permission]]
identifier = "allow-remove-image-pool-orphans"
description = "Allow deleting explicitly listed unused image pool files."
commands.allow = ["remove_image_pool_orphans"]

[[permission]]
identifier = "allow-estimate-image-memory"
description = "Allow estimating VRAM/RAM needs for the image bundle (NVML facts)."
commands.allow = ["estimate_image_memory"]

# ── Генерация ──

[[permission]]
identifier = "allow-generate-image"
description = "Allow text-to-image generation via sd-server."
commands.allow = ["generate_image"]

[[permission]]
identifier = "allow-edit-image"
description = "Allow image editing via sd-server (reference images)."
commands.allow = ["edit_image"]

# ── Видео бандлы ──

[[permission]]
identifier = "allow-get-video-bundles"
description = "Allow listing the video model bundles catalog."
commands.allow = ["get_video_bundles"]

[[permission]]
identifier = "allow-get-video-bundle-info"
description = "Allow reading download proposal/state for a video bundle."
commands.allow = ["get_video_bundle_info"]

[[permission]]
identifier = "allow-set-selected-video-bundle"
description = "Allow selecting the active video bundle (catalog entry)."
commands.allow = ["set_selected_video_bundle"]

[[permission]]
identifier = "allow-validate-video-bundle-dir"
description = "Allow validating an existing video bundle directory."
commands.allow = ["validate_video_bundle_dir"]

[[permission]]
identifier = "allow-set-video-bundle-dir"
description = "Allow pointing the video bundle to an existing valid directory."
commands.allow = ["set_video_bundle_dir"]

[[permission]]
identifier = "allow-download-video-bundle"
description = "Allow downloading all files of a video bundle."
commands.allow = ["download_video_bundle"]

[[permission]]
identifier = "allow-remove-video-bundle-files"
description = "Allow deleting the downloaded video bundle files."
commands.allow = ["remove_video_bundle_files"]

[[permission]]
identifier = "allow-generate-video"
description = "Allow video generation via sd-server (T2VA/I2VA/FL2VA/Ref2VA)."
commands.allow = ["generate_video"]

[default]
description = "Default permissions for the image-engine plugin."
permissions = [
  "allow-get-image-engine-status",
  "allow-install-image-engine",
  "allow-set-image-engine-variant",
  "allow-check-image-engine-update",
  "allow-install-image-engine-update",
  "allow-remove-image-engine",
  "allow-set-image-engine-dir",
  "allow-get-image-models-catalog",
  "allow-get-image-bundle-info",
  "allow-set-selected-image-bundle",
  "allow-download-image-bundle",
  "allow-validate-image-bundle-dir",
  "allow-set-image-bundle-dir",
  "allow-remove-image-bundle",
  "allow-remove-image-bundle-from-list",
  "allow-get-image-pool-orphans",
  "allow-remove-image-pool-orphans",
  "allow-estimate-image-memory",
  "allow-generate-image",
  "allow-edit-image",
  "allow-get-video-bundles",
  "allow-get-video-bundle-info",
  "allow-set-selected-video-bundle",
  "allow-validate-video-bundle-dir",
  "allow-set-video-bundle-dir",
  "allow-download-video-bundle",
  "allow-remove-video-bundle-files",
  "allow-generate-video",
]
