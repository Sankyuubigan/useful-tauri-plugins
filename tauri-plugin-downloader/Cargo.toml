[package]
name = "tauri-plugin-downloader"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-downloader"
description = "Unified file download engine (reqwest multi-chunk + curl + process fallbacks) with progress/speed/ETA events and web-component progress UI"
license = "MIT"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
curl = "0.4"

[lib]
name = "tauri_plugin_downloader"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
