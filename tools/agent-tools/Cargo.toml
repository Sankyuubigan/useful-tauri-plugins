[package]
name = "agent-tools"
version = "0.1.0"
edition = "2021"
description = "CLI-тулы для ИИ-агентов кодеров: эскалация к сильной модели (consult) с жёстким лимитом вызовов"
license = "MIT"

[lib]
name = "agent_tools"
path = "src/lib.rs"

[[bin]]
name = "agent-tools"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# Ядро кодо-тулов (SSOT с хост-приложениями): файлы/поиск/shell. Отдаёт CodeTool-контракт
# тула `code` (CLI call/mcp). regex/ignore/globset приходят через это ядро.
code-tools = { path = "../code-tools" }
# Фича blocking аддитивна: остальные крейты воркспейса её не получают.
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# log без "std" не умеет set_logger: логгер пишет предупреждения json-store в stderr.
log = { workspace = true, features = ["std"] }
json-store = { path = "../../json-store" }

# SSOT-ядро веб-поиска (крейт web-tools): движки/HTTP/кеш/статистика +
# единый обработчик `search`; этот крейт — только CLI/MCP-обёртка над ним.
web-tools = { path = "../web-tools" }

# Инструмент codemap: карта проекта (AST -> лексика -> граф) на чистом Rust.
# Все парсеры проверены на отсутствие C-компиляции во всём графе зависимостей.
syn = { workspace = true }
proc-macro2 = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
rustpython-parser = { workspace = true }
rustpython-ast = { workspace = true }
# Метка времени в индексе. Чистый Rust, C не компилирует.
chrono = { workspace = true }