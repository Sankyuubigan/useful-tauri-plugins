[workspace]
resolver = "2"
members = ["tauri-plugin-about-updates", "tauri-plugin-speech", "tauri-plugin-logs", "tauri-plugin-llama-engine", "tauri-plugin-9router"]

[workspace.dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }

# Аудио (декод + шумоподавление + ресемплинг для голосов TTS)
symphonia = { version = "0.6", features = ["ogg", "vorbis", "wav", "pcm", "flac", "mp3"] }
hound = "3"
opus = "0.3"
ogg = "0.9"
nnnoiseless = "0.5"
rubato = "5"
audioadapter-buffers = "5"

# Скачивание движка CrispASR (prebuilt-процесс, HTTP)
futures = "0.3"
zip = "2"

# STT: WebSocket-клиент + инжекция текста (без нативного линкования CrispASR)
tungstenite = { version = "0.24", features = ["native-tls"] }
arboard = "3"
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }

# Единый кастомный log::Log логгер хоста (core rules §2.5)
log = "0.4"

# Движок llama.cpp (tauri-plugin-llama-engine): GPU-детект, VRAM, скачивание моделей.
# reqwest в плагине объявлен отдельно (default-features=false + rustls, как в хосте).
sysinfo = "0.30.0"
nvml-wrapper = "0.10.0"
sha2 = "0.10"
futures-util = "0.3"
minijinja = "1.0"

# Сохранение озвучки в MP3 (кодек CrispStrobe glint — тот же, что энкодит
# response_format=mp3 в CrispASR; чистый Rust-враппер, без системных либ)
glint-audio = "0.11"
