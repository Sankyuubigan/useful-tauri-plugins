[package]
name = "tauri-plugin-image-engine"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-image-engine"
description = "Reusable stable-diffusion.cpp engine: install/update sd-server.exe variants, image model bundles, VRAM preflight, generate/edit via HTTP (SSOT for King Orch and other hosts)"
license = "MIT"
readme = "docs/README.md"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
# Движок (внешний процесс sd-server) + каталог бандлов. reqwest — как в хосте
# King Orch (default-features=false + rustls, чтобы не конфликтовать
# с native-tls воркспейса).
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots", "stream", "blocking"], default-features = false }
zip = { workspace = true }
sysinfo = "0.30.0"
nvml-wrapper = "0.10.0"
sha2 = "0.10"
futures-util = "0.3"
base64 = "0.22"
# Бенч (Шаг 6/7 PRP): pHash-индикация различий между наборами картинок.
# jpeg/webp нужны refmod-карточкам (SSOT engine/refmod.rs): фото юзера — любые
# форматы (save нормирует в PNG), миниатюра плашки — JPEG-энкод.
image_hasher = "3.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Голос RefMod-карточек (Этап 3, tasks/261104_0230-db2cb59c): декод аудио-вложений
# юзера (mp3/m4a/ogg-vorbis/flac/wav) → PCM16 WAV для ref_audios движка (H3
# voice cloning). Pure Rust, без DLL. opus/webm-аудио НЕ декодируется — в
# symphonia 0.5 opus-кодека нет (проверено crates.io 05.11.26), такие файлы
# честно отклоняются с подсказкой «нужен mp3/wav».
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm", "flac", "mkv"] }

# Единый движок скачивания (SSOT): multi-chunk reqwest + curl + process-фоллбэки,
# stall/resume/прогресс `downloader:progress`.
tauri-plugin-downloader = { path = "../tauri-plugin-downloader" }

# Атомарные записи JSON (app_config.json): tmp->rename + sidecar lock.
json-store = { path = "../json-store" }

[dev-dependencies]
# Бенч: серверные строки sd-server (pipe_log → log::info!) должны попадать
# в bench_run.log, иначе диагностика темпа невозможна.
env_logger = "0.11"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lib]
name = "tauri_plugin_image_engine"
path = "src/lib.rs"
